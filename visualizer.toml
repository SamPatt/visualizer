# ---------------------------------------------------------------------------
# the words
# ---------------------------------------------------------------------------

[[what]]
heading = "WHAT THIS IS"
body = """
This repository is a tool that reads a codebase and draws it as an isometric \
map, with execution flowing along the edges. It is pointed at itself here, so \
the map on the left is [[the program that drew it]].

The shape is a line rather than a loop, because the system is one: read the \
source, decide what it means, put it on the plane, draw it, write one file. \
Nothing flows backwards.
"""

[[what]]
heading = "HOW TO READ IT"
body = """
A block is a module. Its [[height]] is how hard that module works — how often \
it was entered in the recorded run, or how long it is when no run was \
recorded. Its [[footprint]] is how many things it defines. Both are named in \
the bar along the top, so neither has to be guessed at.

Solid lines are call paths. [[Dashed]] lines are the recorded-run path: it \
exists, but it is not switched on unless the tool is asked for it. The \
recorder is the one module that cannot appear in its own recording.

Hover anything for a plain description. The [[How it's built]] tab gives the \
implementation instead. Press → to go inside a block and see its own \
definitions as a map one level down.
"""

[[what]]
heading = "WHAT IS NOT TRUE YET"
body = """
Only Python is read. Call resolution stops at the module boundary — going \
inside a block shows its definitions and the calls between them by name, which \
is a weaker claim than the module-level edges. And the arrangement on the \
plane was typed into a manifest by a person; the automatic layout is only used \
for whatever the manifest does not place.
"""

[[built]]
heading = "THE PIPELINE"
body = """
Six stages, each knowing only the one before it. [[analyze]] reads the source \
without running it. [[tracing]] optionally records a real run over the same \
source. [[manifest]] folds both into a Scene, guided by checked-in judgement. \
[[layout]] places the blocks and routes the edges. [[render]] draws the plane \
as line art. [[page]] wraps it in one self-contained HTML file.
"""

[[built]]
heading = "THE TWO READERS"
body = """
Static analysis says what could be called; a recording says what did. They \
disagree in both directions, and the honest thing is to run both and mark \
which is which. The static reader gives structure for any repository, \
including ones that cannot be run. The recorder gives an exact hop sequence, \
which is the only thing that makes TRACE ONE STEP mean something.

Neither is authoritative on its own, so neither is presented as if it were.
"""

[[built]]
heading = "WHAT THE MANIFEST CARRIES"
body = """
Grouping, keys, plain-language descriptions, and any position that matters. \
None of it can come out of a parser: the groups down the left are meanings, \
not directories, and this panel is written explanation with judgement in it.

The manifest is the artifact. A model can draft it, a person corrects it, and \
it stays checked in — which is what keeps the output stable between runs.
"""

[[built]]
heading = "WHERE IT IS WEAK"
body = """
Edges are routed with two candidate elbows and the less crowded one wins; \
anything more tangled than this map would need a real orthogonal router. \
Depth sorting assumes footprints do not overlap. And a map with several \
hundred blocks on it has already failed at its job, so nothing here is built \
to scale past a few dozen.
"""
