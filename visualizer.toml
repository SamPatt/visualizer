# The manifest for this repository, read by the tool in this repository.
#
# Everything here is judgement a parser cannot supply: what the parts mean,
# what to call them, which ones belong together, and where they sit on the
# plane. The analyser supplies the numbers; this file supplies the words.

[project]
name = "visualizer"
variant = "python · svg"
eyebrow = "VISUALIZER"
title = "The Isometric Reader"
subtitle = "how a repository becomes a map you can walk through"

# ---------------------------------------------------------------------------
# the parts
# ---------------------------------------------------------------------------

[[groups]]
title = "THE WAY IN"

[[groups]]
title = "READING THE CODE"

[[groups]]
title = "DECIDING MEANING"

[[groups]]
title = "ON THE PLANE"

[[groups]]
title = "WHAT COMES OUT"

[[nodes]]
id = "visualizer/__main__.py"
key = "X"
name = "ENTRY POINT"
group = "THE WAY IN"
pos = [0, 0]
size = [3, 3]
what = "Two lines, so that `python -m visualizer` reaches the same place the console script does."
built = "Imports main and raises SystemExit with its return code."

[[nodes]]
id = "visualizer/cli.py"
key = "C"
name = "THE COMMAND LINE"
group = "THE WAY IN"
pos = [0, 9]
what = """
The only part that touches the disk on purpose. It decides whether this run is \
[[recorded]] or merely read, hands the rest of the program a repository path, \
and writes the finished page out.
"""
built = "argparse, then compose() and page.build(). --trace-self records the tool reading the repository and then draws that run."

[[nodes]]
id = "visualizer/analyze.py"
key = "A"
name = "THE STATIC READER"
group = "READING THE CODE"
pos = [10, 1]
what = """
Parses every module without running any of it, and reports what is there: \
modules, their top-level definitions, how long they are, and every place one \
calls another. It is honest about its limit — a static edge means [[there is a \
call site here]], not that the call happens.
"""
built = "ast.NodeVisitor per module, plus a dotted-name table so relative imports resolve to files rather than to the package."

[[nodes]]
id = "visualizer/tracing.py"
key = "T"
name = "THE RECORDER"
group = "READING THE CODE"
pos = [10, 16]
what = """
Runs the code for real under sys.setprofile and keeps only the calls that land \
inside the repository. What it produces is true by construction: block height \
becomes how often something was entered, and TRACE ONE STEP walks hops that \
[[actually happened]], in the order they happened.
"""
built = "A profile hook keeping a module stack; consecutive repeats are collapsed so the flow walks the shape rather than the churn."

[[nodes]]
id = "visualizer/manifest.py"
key = "M"
name = "THE COMPOSER"
group = "DECIDING MEANING"
pos = [21, 8]
what = """
Folds the reading, the recording and this file into the one structure the \
renderer understands. When no manifest exists it stands in for one using the \
package layout — and says so on the page, because that map is the one you \
could already have drawn from `tree`.
"""
built = "Reads TOML with tomllib. Everything downstream sees a Scene and cannot tell which parts were measured and which were written by hand."

[[nodes]]
id = "visualizer/model.py"
key = "D"
name = "THE SHARED WORDS"
group = "DECIDING MEANING"
pos = [21, 21]
kind = "plates"
what = """
The vocabulary every other part agrees on: a node, an edge, a group, a stat, a \
section, and the scene that holds them. A collection of many like things, so \
it is drawn as [[stacked plates]] rather than one solid block.
"""
built = "Plain dataclasses, no behaviour. The one rule is that nothing downstream may ask where a number came from."

[[nodes]]
id = "visualizer/layout.py"
key = "L"
name = "PLACEMENT"
group = "ON THE PLANE"
pos = [31, 1]
what = """
Puts the blocks somewhere and routes the lines between them. It gets it \
roughly right and then gets out of the way: a layered layout will never find \
the legible arrangement a person draws, so any position written in the \
manifest is [[left alone]].
"""
built = "Longest-path layering for anything unplaced; edges elbow the less crowded of two orthogonal routes and are trimmed back to the footprint they leave."

[[nodes]]
id = "visualizer/iso.py"
key = "I"
name = "THE PROJECTION"
group = "ON THE PLANE"
pos = [31, 16]
what = """
True isometric, and the geometry of one extruded rectangle. Three faces can \
ever face this camera, and knowing which is what lets the renderer hatch them \
along opposite axes so a block reads as solid.
"""
built = "Two trigonometric constants and a Box that yields its top, its two visible faces, its silhouette and its depth key."

[[nodes]]
id = "visualizer/render.py"
key = "R"
name = "DRAWING THE PLANE"
group = "WHAT COMES OUT"
pos = [42, 8]
what = """
Line art, single weight, two colours. Everything on the plane is sorted by how \
near the viewer it is and drawn back to front, with edge segments a hair \
behind blocks so a line runs [[under]] a block rather than across its face.
"""
built = "Emits SVG fragments with a depth key, sorts, and joins. The only texture in the system is a hatch pattern, in three directions."

[[nodes]]
id = "visualizer/page.py"
key = "G"
name = "THE PAGE"
group = "WHAT COMES OUT"
pos = [42, 20]
what = """
Wraps the plane in the rest of the instrument: the counted facts along the \
top, the keyed index down the side, this panel, and the line at the bottom \
that spells out every interaction rather than hiding any of them behind \
discovery.
"""
built = "One HTML string with the CSS and the script inlined. Nothing is fetched at runtime, so the output is a single file you can commit or attach."

[[nodes]]
id = "visualizer/__init__.py"
key = "Z"
name = "THE PACKAGE"
group = "WHAT COMES OUT"
pos = [52, 13]
size = [3, 3]
what = "The pipeline written down in one docstring, so the order is stated in the code and not only in the diagram."
built = "Names the stages and nothing else."

